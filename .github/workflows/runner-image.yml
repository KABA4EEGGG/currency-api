# Сборка и публикация образа self-hosted runner (deploy/runner/Dockerfile).
# Образ содержит: GitHub Actions runner, kubectl, helm, k6 — runner-под в k3s
# выполняет стадии deploy / smoke / load-test пайплайна ci-cd.

name: runner-image

on:
  push:
    paths:
      - deploy/runner/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Имя образа в нижнем регистре
        id: image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-actions-runner"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/runner
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
