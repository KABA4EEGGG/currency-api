apiVersion: v1
kind: Secret
metadata:
  name: {{ include "currency.fullname" . }}-db
  labels:
    {{- include "currency.fullnameLabels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.user | quote }}
  database: {{ .Values.database.name | quote }}
  password: {{ required "database.password обязателен (передаётся из CI Secrets)" .Values.database.password | quote }}
  url: "postgres://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ include "currency.fullname" . }}-postgres:5432/{{ .Values.database.name }}?sslmode=disable"
