apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "currency.fullname" . }}
  labels:
    {{- include "currency.fullnameLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "currency.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "currency.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FX_LISTEN_ADDR
              value: ":8080"
            - name: FX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "currency.fullname" . }}-db
                  key: url
            - name: FX_EXCHANGE_API_URL
              value: {{ .Values.externalApi.url | quote }}
            - name: FX_HTTP_TIMEOUT
              value: {{ .Values.externalApi.timeoutSeconds | quote }}
            - name: FX_RATES_TTL
              value: {{ .Values.ratesTtlSeconds | quote }}
            - name: FX_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
