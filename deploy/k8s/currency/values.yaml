# Значения Helm-чарта currency-api.
# image.tag переопределяется CI тегом коммита (требование В2).

image:
  repository: ghcr.io/kseno/currency-api
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 8080
  nodePort: 30090

database:
  # PostgreSQL разворачивается вместе с приложением.
  enabled: true
  image: postgres:17-alpine
  user: currency
  name: currency
  # Секрет: в CI передаётся из GitHub Secrets (--set database.password=...).
  password: ""
  storage: 1Gi
  storageClass: ""

externalApi:
  # Формат open.er-api.com. По умолчанию — заглушка mockfx: работает в
  # изолированных сетях и обязательна под нагрузку (В3). Реальный провайдер:
  #   --set externalApi.url=https://open.er-api.com/v6/latest --set mock.enabled=false
  url: http://currency-mock:8090
  timeoutSeconds: 5

ratesTtlSeconds: 3600
logLevel: info

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  # Окно стабилизации scale-down, сек: как долго CPU должен держаться ниже
  # порога, прежде чем HPA удалит лишнюю реплику (дефолт K8s — 300).
  scaleDownStabilizationSeconds: 60

mock:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    # kube-prometheus-stack по умолчанию выбирает ServiceMonitor с лейблом
    # release=<имя релиза monitoring-стека>.
    additionalLabels:
      release: monitoring
