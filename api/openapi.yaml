openapi: 3.0.3
info:
  title: Currency Exchange API
  description: |
    Сервис курсов валют и конвертера.

    Курсы получаются от внешнего провайдера [exchangerate-api](https://www.exchangerate-api.com)
    (open.er-api.com) и кэшируются в памяти сервиса на время `FX_RATES_TTL`.
    Все конвертации сохраняются в PostgreSQL.
  version: 1.0.0
servers:
  - url: /
    description: локальный запуск и кластер

tags:
  - name: rates
    description: Курсы валют
  - name: convert
    description: Конвертация и история
  - name: favorites
    description: Избранные пары
  - name: ops
    description: Служебные методы

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness-проба
      operationId: healthz
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      tags: [ops]
      summary: Readiness-проба (проверяет доступность БД)
      operationId: readyz
      responses:
        '200':
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: БД недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /metrics:
    get:
      tags: [ops]
      summary: Метрики Prometheus
      operationId: metrics
      responses:
        '200':
          description: Экспозиция метрик в формате Prometheus
          content:
            text/plain:
              schema:
                type: string
  /api/v1/rates/{base}:
    get:
      tags: [rates]
      summary: Курсы валют относительно базовой
      operationId: getRates
      parameters:
        - name: base
          in: path
          required: true
          description: Трёхбуквенный ISO-код базовой валюты
          schema:
            $ref: '#/components/schemas/CurrencyCode'
      responses:
        '200':
          description: Курсы получены (из кэша или от внешнего API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rates'
        '400':
          description: Некорректный код валюты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Внешний API недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/convert:
    post:
      tags: [convert]
      summary: Конвертировать сумму и сохранить в историю
      operationId: convert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
      responses:
        '201':
          description: Конвертация выполнена и записана в БД
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
        '400':
          description: Некорректные валюта или сумма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Валюта не поддерживается провайдером курсов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/conversions:
    get:
      tags: [convert]
      summary: Последние конвертации
      operationId: listConversions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Список конвертаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversion'
  /api/v1/stats:
    get:
      tags: [convert]
      summary: Топ валютных пар по числу конвертаций
      operationId: getStats
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Статистика пар
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PairStat'
  /api/v1/favorites:
    get:
      tags: [favorites]
      summary: Список избранных пар
      operationId: listFavorites
      responses:
        '200':
          description: Список избранных пар
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
    post:
      tags: [favorites]
      summary: Добавить пару в избранное
      operationId: addFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '201':
          description: Пара добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '400':
          description: Некорректный код валюты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пара уже в избранном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/favorites/{id}:
    delete:
      tags: [favorites]
      summary: Удалить пару из избранного
      operationId: deleteFavorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Пара удалена
        '404':
          description: Пара не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: USD
    Status:
      type: object
      properties:
        status:
          type: string
      example:
        status: ok
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: invalid currency code
    Rates:
      type: object
      properties:
        base:
          $ref: '#/components/schemas/CurrencyCode'
        rates:
          type: object
          additionalProperties:
            type: number
            format: double
        updated_at:
          type: string
          format: date-time
      example:
        base: USD
        rates:
          EUR: 0.92
          RUB: 92.5
        updated_at: '2026-11-24T12:00:00Z'
    ConvertRequest:
      type: object
      required: [from, to, amount]
      properties:
        from:
          $ref: '#/components/schemas/CurrencyCode'
        to:
          $ref: '#/components/schemas/CurrencyCode'
        amount:
          type: number
          format: double
          minimum: 0.000001
          exclusiveMinimum: false
          example: 100
      example:
        from: USD
        to: EUR
        amount: 100
    Conversion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        from:
          $ref: '#/components/schemas/CurrencyCode'
        to:
          $ref: '#/components/schemas/CurrencyCode'
        amount:
          type: number
          format: double
        rate:
          type: number
          format: double
        result:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
      example:
        id: 42
        from: USD
        to: EUR
        amount: 100
        rate: 0.92
        result: 92
        created_at: '2026-11-24T12:00:00Z'
    PairStat:
      type: object
      properties:
        base:
          $ref: '#/components/schemas/CurrencyCode'
        quote:
          $ref: '#/components/schemas/CurrencyCode'
        count:
          type: integer
          format: int64
      example:
        base: USD
        quote: EUR
        count: 17
    Favorite:
      type: object
      properties:
        id:
          type: integer
          format: int64
        base:
          $ref: '#/components/schemas/CurrencyCode'
        quote:
          $ref: '#/components/schemas/CurrencyCode'
        created_at:
          type: string
          format: date-time
      example:
        id: 1
        base: USD
        quote: EUR
        created_at: '2026-11-24T12:00:00Z'
    FavoriteRequest:
      type: object
      required: [base, quote]
      properties:
        base:
          $ref: '#/components/schemas/CurrencyCode'
        quote:
          $ref: '#/components/schemas/CurrencyCode'
      example:
        base: USD
        quote: EUR
